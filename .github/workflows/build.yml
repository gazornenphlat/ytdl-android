name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.YTDL_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Missing the YTDL_KEYSTORE secret. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/ytdl-release.jks

      - name: Build
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-android-apk
          path: out/*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ytdl ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
