name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.YTDL_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Missing the YTDL_KEYSTORE secret. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/ytdl-release.jks

      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-android-apk
          path: out/*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ytdl ${{ github.run_number }}
          make_latest: true
          files: out/*.apk

      - name: Save build log to the ci-log branch (for troubleshooting)
        if: always()
        run: |
          grep -nE "^e: |^w: .*deprecated|error:|What went wrong|FAILURE|Could not|> Task .* FAILED" build.log > errors.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/ci && cp build.log errors.txt /tmp/ci/
          git fetch origin ci-log || true
          git checkout --orphan ci-log-tmp
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github .gitignore || true
          cp /tmp/ci/* .
          git add build.log errors.txt
          git commit -m "Build log for run ${{ github.run_number }} (${{ job.status }})"
          git push -f origin HEAD:ci-log
